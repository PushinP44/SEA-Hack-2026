name: Deploy KraDoll to GitHub Pages

# Builds the Vite app in sprout/ and publishes it to GitHub Pages on every push
# to main. The site is static — the /api/story AI call gracefully falls back to
# the built-in template story, so no server or API key is needed.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; a newer push cancels an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sprout
    steps:
      - uses: actions/checkout@v4
        # (submodules default to false, so the unrelated ECC submodule is skipped)

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sprout/package-lock.json

      - run: npm ci

      - name: Build (base = repo subpath)
        run: npm run build
        env:
          PAGES_BASE: /SEA-Hack-2026/

      - name: SPA fallback for client routing (/quiz on refresh)
        run: cp dist/index.html dist/404.html

      # Pages must be enabled once by a repo admin (Settings > Pages > Source:
      # "GitHub Actions"). This step only reads that config — it does not try to
      # create it (the workflow token isn't allowed to).
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: sprout/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
